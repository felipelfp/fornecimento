<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fornecimento Digital - Referência em Negócios Locais</title>
    <meta name="description" content="Assessoria de marketing digital focada em performance, autoridade e escala exponencial para negócios que não aceitam o comum." />
    <meta name="theme-color" content="#050505" />

    <!-- DNS prefetch para domínios externos -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://fornecimentodigital.com" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fontes com display=swap para não bloquear renderização -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />

      <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Open Graph / redes sociais -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fornecimento Digital - Marketing de Alto Padrão" />
    <meta property="og:description" content="O próximo nível do seu faturamento. Tráfego pago elite, estratégias de escala e automação com IA." />
    <meta property="og:url" content="https://fornecimentodigital.com" />
  </head>
